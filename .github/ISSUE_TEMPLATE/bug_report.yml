name: Bug report
description: Report a reproducible LiteCode problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include private files, credentials, or security vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LiteCode version
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
